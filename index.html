<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>רגע של נשימה</title>

    <!-- הגדרות PWA למובייל -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="רגע של נשימה">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">

    <!-- Web Application Manifest (Data URI) -->
    <link rel="manifest" href='data:application/json,{"name":"רגע של נשימה","short_name":"נשימה","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#ffffff","orientation":"portrait"}'>

    <style>
        :root {
            --text-color: #4a5568;
            --bg-color: #ffffff;
            --panel-bg: #ffffff;
            --panel-border: #e2e8f0;
            --select-bg: #ffffff;
            --select-border: #e2e8f0;
            --button-gradient: linear-gradient(135deg, #a1c4fd 0%, #e0c3fc 25%, #fecfef 50%, #c2e9fb 75%, #d4fc79 100%);
            --button-text-color: #2d3748;
            --icon-color: #4a5568;
        }

        body.dark-mode {
            --text-color: #e2e8f0;
            --bg-color: #1a202c;
            --panel-bg: #2d3748;
            --panel-border: #4a5568;
            --select-bg: #1a202c;
            --select-border: #4a5568;
            --button-text-color: #1a202c;
            --icon-color: #cbd5e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-weight: 300;
            transition: background-color 0.3s ease, color 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--icon-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .moon-icon { display: block; }
        .sun-icon { display: none; }

        body.dark-mode .moon-icon { display: none; }
        body.dark-mode .sun-icon { display: block; }

        #screen-setup {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 20;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
        }

        .preview-graphic {
            width: 140px;
            height: 140px;
        }

        .control-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        label {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--select-border);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-color);
            background-color: var(--select-bg);
            outline: none;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        button.action-btn {
            background: var(--button-gradient);
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.1rem;
            color: var(--button-text-color);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(161, 196, 253, 0.4);
            width: 100%;
            user-select: none;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        #screen-active {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 20;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--select-bg);
            border: 1px solid var(--select-border);
            color: var(--text-color);
            padding: 8px 20px;
            width: auto;
            border-radius: 20px;
            font-weight: 400;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .breathing-graphic-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform ease-in-out;
        }

        .splash-svg {
            width: 100%;
            height: 100%;
        }

        .instruction-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        .instruction-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-color);
        }

        .timer-text {
            font-size: 2.8rem;
            font-weight: 300;
            color: var(--text-color);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="שינוי מצב תאורה">
        <svg class="moon-icon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>

    <div class="container">
        <div id="screen-setup">
            <h1>רגע של נשימה</h1>
            
            <svg class="preview-graphic" viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="splash-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a1c4fd" />
                        <stop offset="25%" stop-color="#e0c3fc" />
                        <stop offset="50%" stop-color="#fecfef" />
                        <stop offset="75%" stop-color="#c2e9fb" />
                        <stop offset="100%" stop-color="#d4fc79" />
                    </linearGradient>
                </defs>
                <path d="M150,30 C190,25 220,65 240,95 C260,125 285,145 270,180 C255,215 225,225 205,255 C185,285 140,280 110,265 C80,250 45,260 30,225 C15,190 50,165 40,130 C30,95 70,60 100,45 C120,35 130,32 150,30 Z" 
                      fill="url(#splash-grad-1)" />
            </svg>

            <div class="control-group">
                <label for="technique-select">טכניקת נשימה:</label>
                <select id="technique-select">
                    <option value="4-4-4-4" selected>איזון ופוקוס (4-4-4-4 - קופסה)</option>
                    <option value="4-6">רגיעה וזרימה (4-6)</option>
                    <option value="4-7-8">שחרור עמוק (4-7-8)</option>
                </select>
            </div>

            <button id="start-btn" class="action-btn" type="button">להתחיל</button>
        </div>

        <div id="screen-active" class="hidden">
            <button class="back-btn" id="back-btn" type="button">חזרה</button>
            
            <div class="breathing-graphic-container" id="breathe-circle">
                <svg class="splash-svg" viewBox="0 0 300 300">
                    <defs>
                        <linearGradient id="splash-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#a1c4fd" />
                            <stop offset="25%" stop-color="#e0c3fc" />
                            <stop offset="50%" stop-color="#fecfef" />
                            <stop offset="75%" stop-color="#c2e9fb" />
                            <stop offset="100%" stop-color="#d4fc79" />
                        </linearGradient>
                    </defs>
                    <path d="M150,30 C190,25 220,65 240,95 C260,125 285,145 270,180 C255,215 225,225 205,255 C185,285 140,280 110,265 C80,250 45,260 30,225 C15,190 50,165 40,130 C30,95 70,60 100,45 C120,35 130,32 150,30 Z" 
                          fill="url(#splash-grad-2)" />
                </svg>
                
                <div class="instruction-container">
                    <div class="instruction-text" id="instruction-text">מתחילים...</div>
                    <div class="timer-text" id="timer-text"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
            }
        })();

        window.addEventListener('load', () => {
            const screenSetup = document.getElementById('screen-setup');
            const screenActive = document.getElementById('screen-active');
            const startBtn = document.getElementById('start-btn');
            const backBtn = document.getElementById('back-btn');
            const techniqueSelect = document.getElementById('technique-select');
            const themeToggleBtn = document.getElementById('theme-toggle');

            const breatheCircle = document.getElementById('breathe-circle');
            const instructionText = document.getElementById('instruction-text');
            const timerText = document.getElementById('timer-text');

            let breathingCycle;
            let countdownInterval;
            let isRunning = false;

            themeToggleBtn.onclick = function(e) {
                e.preventDefault();
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };

            const techniques = {
                '4-6': [
                    { phase: 'inhale', text: 'לקחת אוויר...', duration: 4, scale: 1.35 },
                    { phase: 'exhale', text: 'להוציא אוויר...', duration: 6, scale: 1 }
                ],
                '4-4-4-4': [
                    { phase: 'inhale', text: 'לקחת אוויר...', duration: 4, scale: 1.35 },
                    { phase: 'hold', text: 'להחזיק...', duration: 4, scale: 1.35 },
                    { phase: 'exhale', text: 'להוציא אוויר...', duration: 4, scale: 1 },
                    { phase: 'hold', text: 'להחזיק...', duration: 4, scale: 1 }
                ],
                '4-7-8': [
                    { phase: 'inhale', text: 'לקחת אוויר...', duration: 4, scale: 1.35 },
                    { phase: 'hold', text: 'להחזיק...', duration: 7, scale: 1.35 },
                    { phase: 'exhale', text: 'להוציא אוויר...', duration: 8, scale: 1 }
                ]
            };

            function switchScreen(hideScreen, showScreen) {
                hideScreen.classList.add('hidden');
                showScreen.classList.remove('hidden');
                if (showScreen === screenActive) {
                    showScreen.style.display = 'flex';
                }
            }

            function startBreathing() {
                isRunning = true;
                const selectedTechnique = techniqueSelect.value;
                const phases = techniques[selectedTechnique];
                
                instructionText.textContent = 'מתחילים...';
                timerText.textContent = '';
                breatheCircle.style.transform = 'scale(1)';
                breatheCircle.style.transitionDuration = '2s';
                
                setTimeout(() => {
                    if(!isRunning) return;
                    runCycle(phases);
                }, 2000);
            }

            function runCycle(phases) {
                let currentPhaseIndex = 0;

                function nextPhase() {
                    if (!isRunning) return;

                    const phaseData = phases[currentPhaseIndex];
                    
                    instructionText.textContent = phaseData.text;
                    let timeLeft = phaseData.duration;
                    timerText.textContent = timeLeft;

                    breatheCircle.style.transitionDuration = `${phaseData.duration}s`;
                    breatheCircle.style.transform = `scale(${phaseData.scale})`;

                    clearInterval(countdownInterval);
                    countdownInterval = setInterval(() => {
                        timeLeft--;
                        if (timeLeft > 0) {
                            timerText.textContent = timeLeft;
                        } else {
                            clearInterval(countdownInterval);
                        }
                    }, 1000);

                    breathingCycle = setTimeout(() => {
                        currentPhaseIndex = (currentPhaseIndex + 1) % phases.length;
                        nextPhase();
                    }, phaseData.duration * 1000);
                }

                nextPhase();
            }

            function stopBreathing() {
                isRunning = false;
                clearTimeout(breathingCycle);
                clearInterval(countdownInterval);
                breatheCircle.style.transitionDuration = '0.5s';
                breatheCircle.style.transform = 'scale(1)';
                instructionText.textContent = '';
                timerText.textContent = '';
            }

            startBtn.onclick = function(e) {
                e.preventDefault();
                switchScreen(screenSetup, screenActive);
                startBreathing();
            };

            backBtn.onclick = function(e) {
                e.preventDefault();
                stopBreathing();
                switchScreen(screenActive, screenSetup);
            };
        });
    </script>
</body>
</html>
